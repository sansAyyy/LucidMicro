<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1800" role="img" aria-labelledby="title desc">
  <title id="title">LucidMicro runtime topology</title>
  <desc id="desc">Top-down runtime topology showing Caddy, Admin Web, Gateway, Consul, two-replica Identity and Notification services, shared infrastructure, and observability stack.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <marker id="halfArrowEnd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 32px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Segoe UI, Arial, sans-serif; fill: #475569; }
      .section { font: 700 15px Segoe UI, Arial, sans-serif; fill: #334155; letter-spacing: 0; }
      .label { font: 700 18px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .small { font: 600 14px Segoe UI, Arial, sans-serif; fill: #334155; }
      .tiny { font: 500 12px Segoe UI, Arial, sans-serif; fill: #64748b; }
      .note { font: 600 12px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; ry: 18; filter: url(#shadow); }
      .panel { fill: url(#panel); stroke: #94a3b8; stroke-width: 1.7; rx: 22; ry: 22; filter: url(#shadow); }
      .boxBlue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; rx: 16; ry: 16; }
      .boxTeal { fill: #ecfeff; stroke: #14b8a6; stroke-width: 1.5; rx: 16; ry: 16; }
      .boxGreen { fill: #ecfdf5; stroke: #22c55e; stroke-width: 1.5; rx: 16; ry: 16; }
      .boxAmber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; rx: 16; ry: 16; }
      .boxSlate { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 16; ry: 16; }
      .line { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrowSoft); }
      .halfDashEnd { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 6 6; marker-end: url(#halfArrowEnd); }
      .guide { stroke: #cbd5e1; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="1800" fill="url(#bg)"/>

  <text x="640" y="52" text-anchor="middle" class="title">LucidMicro runtime topology</text>
  <text x="640" y="82" text-anchor="middle" class="subtitle">Current Compose deployment, with Identity and Notification scaled to 2 replicas</text>

  <text x="70" y="132" class="section">Clients</text>
  <rect x="140" y="108" width="1000" height="72" class="box"/>
  <rect x="190" y="125" width="220" height="38" class="boxGreen"/>
  <rect x="530" y="125" width="220" height="38" class="boxTeal"/>
  <rect x="870" y="125" width="220" height="38" class="boxAmber"/>
  <text x="300" y="150" text-anchor="middle" class="small">Browser</text>
  <text x="640" y="150" text-anchor="middle" class="small">Mobile / Native</text>
  <text x="980" y="150" text-anchor="middle" class="small">Third-party clients</text>

  <text x="70" y="248" class="section">Entry</text>
  <rect x="430" y="208" width="420" height="72" class="boxBlue"/>
  <text x="640" y="250" text-anchor="middle" class="label">Caddy</text>
  <text x="640" y="270" text-anchor="middle" class="tiny">HTTPS entry and reverse proxy</text>

  <path d="M640 180 L640 208" class="line"/>

  <rect x="100" y="338" width="360" height="92" class="boxTeal"/>
  <text x="280" y="374" text-anchor="middle" class="label">Admin Web</text>
  <text x="280" y="395" text-anchor="middle" class="tiny">Vue 3 admin UI</text>

  <rect x="820" y="338" width="360" height="92" class="boxBlue"/>
  <text x="1000" y="374" text-anchor="middle" class="label">Gateway / YARP</text>
  <text x="1000" y="395" text-anchor="middle" class="tiny">RoundRobin + service discovery</text>

  <path d="M520 244 L280 338" class="line"/>
  <path d="M760 244 L1000 338" class="line"/>
  <path d="M460 384 L820 384" class="dash"/>
  <text x="640" y="372" text-anchor="middle" class="note">API calls</text>

  <text x="70" y="516" class="section">Discovery</text>
  <rect x="430" y="468" width="420" height="82" class="box"/>
  <text x="640" y="503" text-anchor="middle" class="label">Consul</text>
  <text x="640" y="525" text-anchor="middle" class="tiny">service registration and health-aware discovery</text>
  <path d="M1000 430 C1000 470 900 506 850 506" class="dash"/>
  <text x="1018" y="478" class="tiny">discover passing instances</text>

  <text x="70" y="606" class="section">Services</text>

  <rect x="70" y="630" width="540" height="260" class="panel"/>
  <text x="98" y="666" class="label">Identity Service</text>
  <text x="98" y="688" class="tiny">2 replicas / identity-api-1 + identity-api-2</text>
  <rect x="115" y="726" width="190" height="70" class="boxBlue"/>
  <rect x="335" y="726" width="190" height="70" class="boxBlue"/>
  <text x="210" y="767" text-anchor="middle" class="small">identity-api-1</text>
  <text x="430" y="767" text-anchor="middle" class="small">identity-api-2</text>
  <text x="340" y="844" text-anchor="middle" class="tiny">Auth, admin users, roles, permissions, SMS login</text>

  <rect x="670" y="630" width="540" height="260" class="panel"/>
  <text x="698" y="666" class="label">Notification Service</text>
  <text x="698" y="688" class="tiny">2 replicas / notification-api-1 + notification-api-2</text>
  <rect x="715" y="726" width="190" height="70" class="boxAmber"/>
  <rect x="935" y="726" width="190" height="70" class="boxAmber"/>
  <text x="810" y="767" text-anchor="middle" class="small">notification-api-1</text>
  <text x="1030" y="767" text-anchor="middle" class="small">notification-api-2</text>
  <text x="940" y="844" text-anchor="middle" class="tiny">Notification records, sending adapters, event consumption</text>

  <path d="M628 628 L628 548" class="halfDashEnd"/>
  <path d="M652 548 L652 628" class="halfDashEnd"/>
  <text x="592" y="586" text-anchor="middle" class="tiny">register</text>
  <text x="706" y="586" text-anchor="middle" class="tiny">health checks</text>

  <text x="70" y="970" class="section">Shared infrastructure</text>
  <rect x="120" y="1002" width="1040" height="170" class="box"/>
  <rect x="190" y="1062" width="240" height="58" class="boxSlate"/>
  <rect x="520" y="1062" width="240" height="58" class="boxSlate"/>
  <rect x="850" y="1062" width="240" height="58" class="boxSlate"/>
  <text x="310" y="1096" text-anchor="middle" class="small">PostgreSQL</text>
  <text x="640" y="1096" text-anchor="middle" class="small">Redis</text>
  <text x="970" y="1096" text-anchor="middle" class="small">RabbitMQ</text>
  <text x="640" y="1150" text-anchor="middle" class="tiny">Consul is shown in the Discovery layer above</text>
  <path d="M340 890 L340 1002" class="dash"/>
  <path d="M940 890 L940 1002" class="dash"/>
  <text x="356" y="946" class="tiny">data, cache, events</text>
  <text x="956" y="946" class="tiny">data and events</text>

  <text x="70" y="1290" class="section">Observability</text>
  <rect x="120" y="1322" width="1040" height="240" class="box"/>
  <path d="M1000 430 C1160 700 1120 1100 760 1358" class="dash"/>
  <path d="M340 890 C360 1100 470 1270 560 1358" class="dash"/>
  <path d="M940 890 C920 1100 810 1270 720 1358" class="dash"/>
  <text x="1028" y="1180" class="tiny">traces, metrics, logs</text>
  <rect x="500" y="1358" width="280" height="68" class="boxTeal"/>
  <text x="640" y="1392" text-anchor="middle" class="label">OTel Collector</text>
  <text x="640" y="1412" text-anchor="middle" class="tiny">metrics, traces and logs pipeline</text>

  <rect x="160" y="1490" width="180" height="58" class="boxSlate"/>
  <rect x="370" y="1490" width="180" height="58" class="boxSlate"/>
  <rect x="580" y="1490" width="180" height="58" class="boxSlate"/>
  <rect x="790" y="1490" width="180" height="58" class="boxSlate"/>
  <rect x="1000" y="1490" width="120" height="58" class="boxSlate"/>
  <text x="250" y="1524" text-anchor="middle" class="small">Loki</text>
  <text x="460" y="1524" text-anchor="middle" class="small">Tempo</text>
  <text x="670" y="1524" text-anchor="middle" class="small">Prometheus</text>
  <text x="880" y="1524" text-anchor="middle" class="small">Grafana</text>
  <text x="1060" y="1524" text-anchor="middle" class="small">Dashboards</text>

  <path d="M640 1426 L250 1490" class="dash"/>
  <path d="M640 1426 L460 1490" class="dash"/>
  <path d="M640 1426 L670 1490" class="dash"/>
  <path d="M640 1426 L880 1490" class="dash"/>
  <path d="M640 1426 L1060 1490" class="dash"/>

  <text x="640" y="1690" text-anchor="middle" class="subtitle">Gateway routes to service replicas through Consul; Identity and Notification are scaled to 2 nodes in Compose.</text>
  <text x="640" y="1716" text-anchor="middle" class="subtitle">Shared infrastructure: PostgreSQL, Redis, RabbitMQ, Loki, Tempo, Prometheus and Grafana.</text>
</svg>
