services:
  caddy:
    image: ${CADDY_IMAGE:-lucidmicro/caddy-cloudflare:local}
    build:
      context: ../../..
      dockerfile: deploy/docker/caddy/Dockerfile
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL is required}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required}
    volumes:
      - ../../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - lucid-app

volumes:
  caddy_data:
  caddy_config:

networks:
  lucid-app:
    external: true
    name: lucid-app
